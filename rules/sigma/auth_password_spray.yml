title: Single Source Failing Against Many Distinct Accounts
id: b28d4f70-91ac-4e63-8f15-2c0d7e6b3a58
status: experimental
description: >
  Detects password spraying: one source producing authentication failures
  across several distinct accounts inside a short window. Spraying is broad and
  shallow, which distinguishes it from a brute force against a single account.
author: sxfish389-sketch
date: 2026/08/20
logsource:
    product: lab
    service: auth
detection:
    selection:
        result: failure
    condition: selection | count(user) by source_ip > 2
    timeframe: 5m
fields:
    - source_ip
    - user
falsepositives:
    - A shared NAT gateway or corporate proxy after a password-policy change
    - A misconfigured directory-sync agent
level: high
tags:
    - attack.credential_access
    - attack.t1110.003
